# Garde-fou local. Installation : pre-commit install
# Mise a jour des versions epinglees : pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: tests unitaires
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true

      - id: complexite
        name: barriere de complexite
        entry: xenon --max-absolute B --max-modules A --max-average A .
        language: system
        pass_filenames: false
        always_run: true
